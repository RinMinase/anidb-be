volumes:
  anidb-db:

name: anidb-app

services:
  php:
    container_name: anidb-backend
    restart: unless-stopped
    build:
      context: ./docker
      dockerfile: php.dockerfile
      args:
        - PHP_VERSION=8.5.4
        - ALPINE_VERSION=3.23
        - COMPOSER_VERSION=2.9.5
    volumes:
      - ./:/srv
      - ./docker/logs/:/etc/supervisor/logs
    expose:
      - "9000"
    working_dir: /srv
    tty: true

  caddy:
    container_name: anidb-caddy
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    ports:
      - '${APP_PORT:-80}:80'
    volumes:
      - ./docker/caddyfile:/etc/caddy/Caddyfile
      - ./:/srv
    depends_on:
      - php

  db:
    container_name: anidb-pgsql
    image: postgres:18.3-alpine3.23
    restart: unless-stopped
    tty: true
    environment:
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_DATABASE:-anidb}
    expose:
      - "5432"
    ports:
      - '${DB_EXT_PORT:-5432}:5432'
    volumes:
      - anidb-db:/var/lib/postgresql
